<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/coach/support.js"></script>
</head>
<body>
<x-dc>
<div style="container-type:inline-size;width:100%;position:relative">
  <span aria-hidden="true" style="position:absolute;left:-0.7cqw;top:18%;width:1.1cqw;height:5%;border-radius:1cqw 0 0 1cqw;background:linear-gradient(90deg,#2a2a2c,#6b6b70)"></span>
  <span aria-hidden="true" style="position:absolute;left:-0.7cqw;top:26%;width:1.1cqw;height:9%;border-radius:1cqw 0 0 1cqw;background:linear-gradient(90deg,#2a2a2c,#6b6b70)"></span>
  <span aria-hidden="true" style="position:absolute;left:-0.7cqw;top:37%;width:1.1cqw;height:9%;border-radius:1cqw 0 0 1cqw;background:linear-gradient(90deg,#2a2a2c,#6b6b70)"></span>
  <span aria-hidden="true" style="position:absolute;right:-0.7cqw;top:30%;width:1.1cqw;height:14%;border-radius:0 1cqw 1cqw 0;background:linear-gradient(270deg,#2a2a2c,#6b6b70)"></span>
  <div style="position:relative;border-radius:17cqw;padding:1.3cqw;background:linear-gradient(145deg,#8a8a8f 0%,#2b2b2e 18%,#1b1b1d 50%,#3a3a3d 82%,#9a9a9f 100%);box-shadow:0 6cqw 12cqw -4cqw rgba(0,0,0,0.35),0 2cqw 4cqw -2cqw rgba(0,0,0,0.25)">
    <div style="border-radius:15.8cqw;padding:3.2cqw;background:#050505;box-shadow:inset 0 0 0 0.4cqw #151515">
      <div ref="{{ root }}" style="position:relative;border-radius:12.6cqw;overflow:hidden;aspect-ratio:1179/2556;background:#0F0F0F">
        <sc-for list="{{ layers }}" as="L" hint-placeholder-count="1">
          <sc-if value="{{ L.img }}" hint-placeholder-val="{{ true }}"><img data-i="{{ L.i }}" src="{{ L.src }}" alt="{{ L.alt }}" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:block;opacity:{{ L.op }};z-index:{{ L.z }};transition:{{ L.tr }}"></sc-if>
          <sc-if value="{{ L.vid }}" hint-placeholder-val="{{ false }}"><video data-i="{{ L.i }}" src="{{ L.src }}" aria-label="{{ L.alt }}" muted="{{ true }}" playsInline="{{ true }}" preload="{{ L.preload }}" onEnded="{{ onEnded }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:block;opacity:{{ L.op }};z-index:{{ L.z }};transition:{{ L.tr }}"></video></sc-if>
        </sc-for>
        <span aria-hidden="true" style="position:absolute;z-index:3;top:2.4cqw;left:50%;transform:translateX(-50%);width:29cqw;height:8.4cqw;border-radius:100px;background:#000"></span>
        <span aria-hidden="true" style="position:absolute;z-index:3;inset:0;background:linear-gradient(118deg,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0) 32%);pointer-events:none"></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:680},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/coach/assets/app-sesion.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pantalla de la app BIVO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;isVideo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;[string,string,number?]&gt;&quot;},&quot;index&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;onShown&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;},&quot;onEnded&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { vis: -1, prev: -1 };
  root = React.createRef();
  items() {
    const p = this.props;
    return p.items && p.items.length ? p.items : [[p.src ?? '/coach/assets/app-sesion.png', p.alt ?? 'Pantalla de la app BIVO', p.isVideo ? 1 : 0]];
  }
  idx() { return Math.max(0, Math.min(this.props.index ?? 0, this.items().length - 1)); }
  componentDidMount() { this.sync(); }
  componentDidUpdate(pp) { if ((pp.index ?? 0) !== (this.props.index ?? 0) || pp.items !== this.props.items) this.sync(); }
  sync() {
    const r = this.root.current; if (!r) return;
    const i = this.idx();
    const el = r.querySelector(`[data-i="${i}"]`);
    if (!el) { requestAnimationFrame(() => this.sync()); return; }
    const show = () => {
      if (this.idx() !== i) return;
      if (el.tagName === 'VIDEO') { try { el.play().catch(() => {}); } catch (e) {} }
      if (this.state.vis === i) return;
      this.setState(s => ({ prev: s.vis, vis: i }), () => {
        r.querySelectorAll('video').forEach(v => { if (Number(v.dataset.i) !== i) v.pause(); });
        this.props.onShown && this.props.onShown(i);
      });
    };
    if (el.tagName === 'VIDEO') {
      try { el.currentTime = 0; } catch (e) {}
      if (el.readyState >= 3) show();
      else { el.addEventListener('canplay', show, { once: true }); if (el.preload !== 'auto') { el.preload = 'auto'; el.load(); } }
    } else {
      if (el.complete && el.naturalWidth) show();
      else el.addEventListener('load', show, { once: true });
    }
  }
  renderVals() {
    const items = this.items(), n = items.length, cur = this.idx(), { vis, prev } = this.state;
    const layers = items.map(([src, alt, v], i) => {
      const on = i === vis || (vis === -1 && i === cur);
      const under = i === prev;
      const soon = i === cur || i === (cur + 1) % n;
      return {
        i, src, alt, img: !v, vid: !!v,
        op: on || under ? 1 : 0, z: on ? 2 : under ? 1 : 0,
        tr: on ? 'opacity 280ms ease-out' : 'none',
        preload: soon ? 'auto' : 'none',
      };
    });
    return {
      root: this.root, layers,
      onEnded: e => { if (Number(e.currentTarget.dataset.i) === this.idx() && this.props.onEnded) this.props.onEnded(); },
    };
  }
}
</script>
</body>
</html>
